[workspace]
resolver = "2"
members = [
    "crates/talaria-contracts",
    "crates/talaria-operators",
    "crates/talaria-store",
    "crates/talaria-feed",
    "crates/talaria-packs",
    "crates/talaria-server",
    "crates/talaria-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
talaria-contracts = { path = "crates/talaria-contracts" }
talaria-operators = { path = "crates/talaria-operators" }
talaria-store = { path = "crates/talaria-store" }
talaria-feed = { path = "crates/talaria-feed" }
talaria-packs = { path = "crates/talaria-packs" }
talaria-server = { path = "crates/talaria-server" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
arrow = { version = "60", features = ["ipc"] }
parquet = { version = "60", features = ["arrow", "zstd"] }
rusqlite = { version = "0.43", features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
tempfile = "3"
jsonschema = "0.30"
zip = { version = "2", default-features = false, features = ["deflate"] }
