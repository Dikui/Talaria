[project]
name = "talaria"
version = "0.0.2"
description = "Talaria 确定性数据底座与本地看盘守护进程"
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2.14,<3",
  "fastapi>=0.164,<1",
  "uvicorn>=0.54,<1",
  "httpx>=0.28,<1",
  "pyarrow>=26,<27",
  "websockets>=15,<16",
]

[project.scripts]
talaria = "talaria.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talaria"]
