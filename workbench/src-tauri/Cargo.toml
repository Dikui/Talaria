[workspace]

[package]
name = "talaria-workbench-tauri"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Talaria standalone workbench desktop thin shell (Tauri v2)"

[lib]
name = "talaria_workbench_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
